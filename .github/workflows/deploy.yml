name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: touch .env

      - name: Run test suite in Docker
        run: |
          docker compose --profile dev build agents-dev
          docker compose --profile dev run --rm --no-deps agents-dev pytest -q

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /home/bayleaf/bayleaf-agents
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose --profile prod up -d --build --remove-orphans
            docker image prune -f
