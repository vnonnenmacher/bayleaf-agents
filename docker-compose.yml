services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bayleaf
      POSTGRES_PASSWORD: bayleaf
      POSTGRES_DB: bayleaf_agents
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  agents-dev:
    build:
      context: .
      target: test
    depends_on:
      - db
      - redis
      - presidio-analyzer
      - qdrant
    environment:
      APP_ENV: dev
      HOST: 0.0.0.0
      PORT: 8080
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      BAYLEAF_BASE_URL: ${BAYLEAF_BASE_URL:-https://bayleaf.nonnenmacher.tech}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://bayleaf:bayleaf@db:5432/bayleaf_agents
      PHI_FILTER_URL: http://presidio-analyzer:3000/analyze
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      EMBEDDING_MODELS: ${EMBEDDING_MODELS:-intfloat/multilingual-e5-base,BAAI/bge-m3}
      EMBEDDING_DEFAULT_MODEL: ${EMBEDDING_DEFAULT_MODEL:-intfloat/multilingual-e5-base}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    profiles:
      - dev

  worker-dev:
    build:
      context: .
      target: test
    depends_on:
      - db
      - redis
      - presidio-analyzer
      - qdrant
    environment:
      APP_ENV: dev
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      BAYLEAF_BASE_URL: ${BAYLEAF_BASE_URL:-https://bayleaf.nonnenmacher.tech}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://bayleaf:bayleaf@db:5432/bayleaf_agents
      PHI_FILTER_URL: http://presidio-analyzer:3000/analyze
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      EMBEDDING_MODELS: ${EMBEDDING_MODELS:-intfloat/multilingual-e5-base,BAAI/bge-m3}
      EMBEDDING_DEFAULT_MODEL: ${EMBEDDING_DEFAULT_MODEL:-intfloat/multilingual-e5-base}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      - celery
      - -A
      - bayleaf_agents.workers.tasks:celery_app
      - worker
      - --loglevel=INFO
    volumes:
      - .:/app
    profiles:
      - dev

  agents:
    build:
      context: .
      target: runtime
    depends_on:
      - db
      - redis
      - presidio-analyzer
      - qdrant
    env_file:
      - .env
    environment:
      APP_ENV: prod
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bayleaf}:${POSTGRES_PASSWORD:-bayleaf}@db:5432/${POSTGRES_DB:-bayleaf_agents}
      PHI_FILTER_URL: http://presidio-analyzer:3000/analyze
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    ports:
      - "127.0.0.1:${AGENTS_PORT:-8080}:8080"
    restart: unless-stopped
    profiles:
      - prod

  worker:
    build:
      context: .
      target: runtime
    depends_on:
      - db
      - redis
      - presidio-analyzer
      - qdrant
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bayleaf}:${POSTGRES_PASSWORD:-bayleaf}@db:5432/${POSTGRES_DB:-bayleaf_agents}
      PHI_FILTER_URL: http://presidio-analyzer:3000/analyze
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    command:
      - celery
      - -A
      - bayleaf_agents.workers.tasks:celery_app
      - worker
      - --loglevel=INFO
    restart: unless-stopped
    profiles:
      - prod

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    environment:
      ANALYZER_DEFAULT_MODEL_LANG: en
      PYTHONIOENCODING: utf-8
      PRESIDIO_LOG_LEVEL: DEBUG
      ANALYZER_LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8001:3000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped


volumes:
  pgdata:
  qdrant-data:
